name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript (game rules, contract)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck (incl. contract/simulator drift guard)
        run: pnpm -r typecheck

      - name: Game rules tests
        run: pnpm --filter @vybe/game-rules test

      - name: Web prototype tests
        run: pnpm --filter @vybe/web test

      - name: Web prototype build
        run: pnpm --filter @vybe/web build

      - name: Lint OpenAPI contract
        run: pnpm --filter @vybe/contracts lint

      - name: Generated files are up to date
        run: |
          pnpm --filter @vybe/game-rules generate:fixtures
          pnpm --filter @vybe/contracts generate
          git diff --exit-code -- packages/game-rules/fixtures packages/contracts/src/generated

  e2e:
    name: Browser tests (Playwright, Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      E2E_DATABASE_URL: postgres://vybe:vybe@localhost:55432/vybe
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: vybe
          POSTGRES_PASSWORD: vybe
          POSTGRES_DB: vybe
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U vybe -d vybe"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Create the database schema
        run: psql "$E2E_DATABASE_URL" -q -v ON_ERROR_STOP=1 -f services/api/db/schema.sql

      - name: Build the API
        run: dotnet build services/api/src/Vybe.Api

      - name: Install Chromium
        run: pnpm --filter @vybe/e2e exec playwright install --with-deps --only-shell chromium

      - name: Playwright tests
        run: pnpm --filter @vybe/e2e test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14

  dotnet:
    name: .NET (simulator parity, database)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/api
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Build (warnings are errors)
        run: dotnet build Vybe.slnx -c Release

      - name: Format check
        run: dotnet format Vybe.slnx --verify-no-changes --no-restore

      - name: Tests (game rules parity; PostgreSQL via Testcontainers)
        run: >-
          dotnet test Vybe.slnx -c Release --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ${{ github.workspace }}/TestResults

      - name: db/schema.sql is up to date
        run: |
          dotnet ef migrations script --project src/Vybe.Data --configuration Release --no-build --output db/schema.sql
          git diff --exit-code -- db/schema.sql

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dotnet-coverage
          path: ${{ github.workspace }}/TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn
          retention-days: 14

  deploy-config:
    name: Deployment config (Fly.io files, images)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # flyctl config validate needs a Fly.io token, so pull requests use the offline check (ADR 0008).
      - name: Check infra/fly/*.fly.toml
        run: python3 infra/fly/check-config.py

      - name: Build the API image
        run: docker build -f services/api/Dockerfile -t vybe-api:ci .

      - name: Build the web image
        run: docker build -f infra/web/Dockerfile -t vybe-web:ci .

      # The web image in front of a stub upstream (Caddy from the same image) that echoes the forwarded headers.
      - name: Web container serves the app, the headers and the proxy rules
        run: |
          mkdir -p "$RUNNER_TEMP/stub"
          printf '%s\n' '{' '  admin off' '  auto_https off' '}' ':8080 {' \
            '  respond "xff=[{header.X-Forwarded-For}] fly=[{header.Fly-Client-IP}]"' '}' > "$RUNNER_TEMP/stub/Caddyfile"
          chmod -R a+rX "$RUNNER_TEMP/stub"
          docker network create vybe-ci
          docker run -d --name stub --network vybe-ci -v "$RUNNER_TEMP/stub:/stub:ro" --entrypoint caddy \
            vybe-web:ci run --config /stub/Caddyfile --adapter caddyfile
          docker run -d --name vybe-web --network vybe-ci --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true -e VYBE_API_HOST=stub -p 127.0.0.1:8081:8080 vybe-web:ci
          for _ in $(seq 1 20); do curl -fsS -o /dev/null http://127.0.0.1:8081/ && break; sleep 1; done
          web=http://127.0.0.1:8081

          curl -fsS -D headers.txt -o index.html "$web/hub"
          grep -q '<vybe-root>' index.html
          grep -qi "^content-security-policy:.*frame-ancestors 'none'" headers.txt
          grep -qi '^referrer-policy: no-referrer' headers.txt
          grep -qi '^strict-transport-security: max-age=' headers.txt
          grep -qi '^cache-control: no-cache' headers.txt
          # No inline script: the CSP (script-src 'self') would block it.
          if grep -q '<script>' index.html; then echo "index.html has an inline script" >&2; exit 1; fi

          status() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          test "$(status "$web/chunk-MISSING1.js")" = 404
          test "$(status "$web/missing.png")" = 404
          test "$(status "$web/runtime-config.json")" = 404
          test "$(status "$web/health")" = 404
          test "$(status "$web/health/ready")" = 404
          # Bodies over the proxy limit stop at Caddy.
          head -c 70000 /dev/zero | tr '\0' 'a' > big.txt
          test "$(status -X POST --data-binary @big.txt "$web/api/v1/guests")" = 413

          # The client address: Fly-Client-IP from a private peer becomes the only X-Forwarded-For value, and a
          # client-sent X-Forwarded-For never reaches the API.
          body=$(curl -fsS -H 'X-Forwarded-For: 6.6.6.6' -H 'Fly-Client-IP: 203.0.113.7' "$web/api/v1/echo")
          test "$body" = "xff=[203.0.113.7] fly=[]"
          body=$(curl -fsS -H 'X-Forwarded-For: 6.6.6.6' "$web/api")
          case "$body" in *6.6.6.6*|"xff=[]"*) echo "forged or empty X-Forwarded-For: $body" >&2; exit 1;; esac

      - name: Web container logs
        if: failure()
        run: docker logs vybe-web; docker logs stub

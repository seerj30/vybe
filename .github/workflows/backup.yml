# Weekly encrypted dump of the production database (Supabase Free has no automatic backups).
# Script: infra/oracle/backup.sh. Runbook: docs/runbooks/backup-restore.md, "Weekly dump on Supabase Free".
# The "backup" environment has no required reviewers (a schedule cannot wait for an approval); its deployment branch
# rule allows master only. A failed run emails the person who last changed this file's schedule, and the optional
# heartbeat (VYBE_BACKUP_PING_URL) alerts when no successful run arrives, for example when GitHub disables schedules
# after 60 days without repository activity.
name: Backup

on:
  schedule:
    - cron: "17 3 * * 0" # Sundays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-production
  cancel-in-progress: false

jobs:
  backup:
    name: Encrypted pg_dump to vybe-exports/backups/
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: backup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install age
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends age

      - name: Dump, encrypt, upload, apply retention
        env:
          VYBE_BACKUP_DB_PASSWORD: ${{ secrets.VYBE_BACKUP_DB_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.VYBE_BACKUP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.VYBE_BACKUP_S3_SECRET_ACCESS_KEY }}
        run: infra/oracle/backup.sh

      - name: Heartbeat
        if: always()
        env:
          PING_URL: ${{ secrets.VYBE_BACKUP_PING_URL }}
          OUTCOME: ${{ job.status }}
        run: |
          if [ -z "$PING_URL" ]; then echo "No VYBE_BACKUP_PING_URL: no heartbeat."; exit 0; fi
          url="$PING_URL"
          if [ "$OUTCOME" != success ]; then url="$url/fail"; fi
          printf 'url = "%s"\n' "$url" | curl -fsS --max-time 10 --retry 3 -o /dev/null -K -

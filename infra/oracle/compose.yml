# VYBE production on one Oracle Cloud Always Free VM (decision 7 as changed on 2026-11-10, ADR 0009).
# Runbook: docs/runbooks/oracle-vm.md. Installed by bootstrap.sh as /opt/vybe/compose.yml; vybe-deploy (deploy.sh) runs
#   docker compose -p vybe -f /opt/vybe/compose.yml --env-file /opt/vybe/release.env up -d --wait
#
# release.env (written by vybe-deploy, no secrets): VYBE_API_IMAGE and VYBE_WEB_IMAGE (GHCR, by digest), VYBE_RELEASE
# (git SHA). Secrets and per-environment values: /etc/vybe/api.env and /etc/vybe/web.env (root:root, mode 600, written
# by stage-env.sh), never in this repository. The release step (migrate, seed) never runs here: the deploy workflow
# runs it on the GitHub runner, so the owner credential is never on this VM (ADR 0006 #2, ADR 0008 #6).
#
# VYBE_ENV_DIR, VYBE_CADDY_DATA, VYBE_HTTP_PORT and VYBE_HTTPS_PORT exist for CI and local tests only; the defaults
# are the production values.
name: vybe

services:
  api:
    image: ${VYBE_API_IMAGE:?set by vybe-deploy}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    # Within the free VM (VM.Standard.A1.Flex, 2 OCPU / 12 GB): room for the .NET GC and the health check process.
    mem_limit: 2g
    cpus: 1.5
    # ASP.NET Core waits 30 s for running requests on SIGTERM.
    stop_grace_period: 35s
    env_file:
      - path: ${VYBE_ENV_DIR:-/etc/vybe}/api.env
        required: true
    environment:
      # X-Forwarded-For and X-Forwarded-Proto only from the compose network below (Caddy). Never /0 (ADR 0006 #8).
      ReverseProxy__KnownNetworks__0: 172.30.80.0/24
      Sentry__Release: ${VYBE_RELEASE:?set by vybe-deploy}
    # No published port: only Caddy reaches the API, over the compose network.
    healthcheck:
      # The chiseled image has no curl: the image calls its own /health/ready (HealthProbe.cs).
      test: ["CMD", "dotnet", "Vybe.Api.dll", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 3s
    networks: [vybe]

  web:
    image: ${VYBE_WEB_IMAGE:?set by vybe-deploy}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 512m
    cpus: 0.5
    stop_grace_period: 35s
    # Caddy runs as UID 10001 without capabilities: allow ports 80 and 443 in this container's network namespace only.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    ports:
      - "${VYBE_HTTP_PORT:-80}:80"
      - "${VYBE_HTTPS_PORT:-443}:443"
    env_file:
      - path: ${VYBE_ENV_DIR:-/etc/vybe}/web.env
        required: true
    environment:
      VYBE_API_HOST: api
      # Certificates and the ACME account survive restarts (Let's Encrypt limits new certificates per week).
      XDG_DATA_HOME: /data
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # bootstrap.sh creates it: owner 10001:10001, mode 700.
      - ${VYBE_CADDY_DATA:-/var/lib/vybe/caddy}:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 2s
    depends_on:
      api: { condition: service_started }
    networks: [vybe]

networks:
  vybe:
    name: vybe
    # A fixed subnet, so the API can trust forwarded headers from this network only.
    ipam:
      config:
        - subnet: 172.30.80.0/24
